# -----------------------------------------------------------------------------
# Nginx del frontend de Univalle Shop.
# - Sirve la aplicación React ya compilada (carpeta dist/).
# - Reenvía /api/* al API Gateway dentro de la red de Docker, así el navegador
#   habla con un solo origen y no hace falta CORS.
# - Para cualquier otra ruta (ej. /productos/123) devuelve index.html, porque
#   las rutas las resuelve React Router en el navegador.
# -----------------------------------------------------------------------------
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://gateway:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # Archivos con hash en el nombre: se pueden guardar en caché por mucho tiempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
